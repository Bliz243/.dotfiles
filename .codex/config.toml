# Codex CLI Configuration
# Source of truth managed via dotfiles.
# Runtime data and auth stay in ~/.codex/.

model = "gpt-5.5"
model_reasoning_effort = "xhigh"
personality = "pragmatic"

# Sandbox: workspace-write allows file edits in project, no network by default.
sandbox_mode = "workspace-write"

# Web search
web_search = "cached"
service_tier = "fast"

[features]
shell_tool = true
request_rule = true
goals = true
rmcp_client = true

[projects."/home/jacob/ImperiOps/subscription-management"]
trust_level = "trusted"

[projects."/home/jacob/DTU/Event-Driven"]
trust_level = "trusted"

[projects."/home/jacob/Kathie_and_Jacob_projects/Timeline"]
trust_level = "trusted"

[projects."/home/jacob/Master-Project/frontend-dokploy-migration"]
trust_level = "trusted"

[projects."/home/jacob/Ai-fence"]
trust_level = "trusted"

[projects."/home/jacob/FenceTechnology/Webapp"]
trust_level = "trusted"

[projects."/home/jacob/talos-homelab"]
trust_level = "trusted"

