# ─────────────────────────────────────────────
# Core settings
# ─────────────────────────────────────────────
# Use tmux-256color if terminfo exists, fall back to screen-256color (always available)
if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
  set -g default-terminal "tmux-256color"
} {
  set -g default-terminal "screen-256color"
}
set -sa terminal-overrides ",xterm*:Tc"
# Let tmux push copies to the outer terminal via OSC 52 (Windows Terminal
# supports it) — makes clipboard work over SSH without any helper binary
set -as terminal-features 'xterm*:clipboard'
set -g mouse on

# ─────────────────────────────────────────────
# Prefix key (configurable per machine)
# ─────────────────────────────────────────────
# Set TMUX_PREFIX in ~/.zsh/99-local.zsh:
#   - Local (WSL):  export TMUX_PREFIX="C-a"  (default)
#   - Remote (VPS): export TMUX_PREFIX="C-b"
#
# Default: C-a
unbind C-b
unbind C-a
set -g prefix C-a
bind C-a send-prefix

# Override prefix if TMUX_PREFIX is set to C-b
if-shell '[ "$TMUX_PREFIX" = "C-b" ]' {
  set -g prefix C-b
  bind C-b send-prefix
}

# Windows/panes start at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Sensible defaults
# escape-time 0 is ideal locally but breaks bracketed paste over SSH —
# the escape sequence arrives in split packets and tmux misinterprets it.
# 50ms is imperceptible for keypresses but enough for paste sequences.
set -s escape-time 50
if-shell '[ "$MACHINE_TYPE" != "remote" ]' {
  set -s escape-time 0
}
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g status-keys emacs
set -g set-clipboard on

# Extended keys and passthrough (tmux 3.3+ only)
# "on" (not "always"): apps that need extended keys (nvim, Claude Code)
# request them; "always" force-feeds extended encodings to every app and
# causes intermittent key weirdness with mixed TUIs
if-shell '[ "$(tmux -V | cut -d" " -f2 | tr -d "a-z")" \> "3.2" ]' {
  set -s extended-keys on
  set -as terminal-features 'xterm*:extkeys'
  # "limited" is not a valid value (on|off|all) — the old setting silently
  # failed and left passthrough off
  set -g allow-passthrough on
}

# ─────────────────────────────────────────────
# Pane navigation (vim-style)
# ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Arrows without -r: the default repeatable binds keep tmux in the prefix
# table for repeat-time (500ms), swallowing the next arrow keypress after
# switching panes — feels like the prefix "resets"
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ─────────────────────────────────────────────
# Window navigation
# ─────────────────────────────────────────────
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# ─────────────────────────────────────────────
# Splits (keep current path)
# ─────────────────────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─────────────────────────────────────────────
# Copy mode (vi) and mouse selection
# ─────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Mouse selection copies to clipboard
set -g @yank_selection_mouse 'clipboard'

# WSL: pipe copies to win32yank (writes the Windows clipboard directly).
# Without this tmux-yank falls back to xclip, and WSLg's X11→Windows
# clipboard sync drops copies intermittently.
if-shell 'command -v win32yank.exe' {
  set -g @override_copy_command 'win32yank.exe -i --crlf'
}

# Double-click to select word, triple-click to select line
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line }

# Drag to select (auto-copies on release via tmux-yank)
bind -n MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H }

# Shift+click bypasses tmux (native terminal selection)
bind -T root S-MouseDown1Pane send-keys -M
bind -T root S-MouseDrag1Pane send-keys -M
bind -T root S-MouseDown3Pane send-keys -M

# WSL: paste from Windows clipboard via win32yank if available.
# Falls back to tmux's internal buffer on machines without win32yank.
if-shell 'command -v win32yank.exe' \
  'bind ] run-shell "win32yank.exe -o --lf | tmux load-buffer - && tmux paste-buffer"'

# ─────────────────────────────────────────────
# Utilities
# ─────────────────────────────────────────────
bind R source-file ~/.tmux.conf \; display "Config reloaded!"
bind x kill-pane

# ─────────────────────────────────────────────
# Plugins
# ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ─────────────────────────────────────────────
# Catppuccin Theme (color changes based on machine)
# ─────────────────────────────────────────────
# Default: mocha (dark purple-ish) for local
set -g @catppuccin_flavor 'mocha'

# Remote/VPS: macchiato (slightly different tone) - visual indicator
if-shell '[ "$TMUX_PREFIX" = "C-b" ]' {
  set -g @catppuccin_flavor 'macchiato'
}

# ─────────────────────────────────────────────
# Window naming
# ─────────────────────────────────────────────
# Pane titles are set by zsh preexec/precmd hooks
set -g set-titles on
set -g allow-rename on

# Window styling
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_window_default_fill 'number'
set -g @catppuccin_window_current_fill 'number'

# Show pane title (set by zsh to current command)
set -g @catppuccin_window_default_text '#T'
set -g @catppuccin_window_current_text '#T'

# Status bar position
set -g status-position bottom
set -g status-justify left

# Status left: prefix indicator (visible while tmux waits for a prefix key —
# a stray C-a otherwise leaves you stuck with no feedback) + session name
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[reverse] ^A #[default] ,}#{E:@catppuccin_status_session} "

# Status right: directory only
set -g status-right-length 100
set -g @catppuccin_directory_text "#{s|$HOME|~|:pane_current_path}"
set -g status-right "#{E:@catppuccin_status_directory}"

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# ─────────────────────────────────────────────
# Post-plugin overrides (must stay below TPM)
# ─────────────────────────────────────────────
# tmux-yank binds mouse release to copy-and-cancel, which exits copy mode and
# kills the selection the moment the button lifts. Copy but keep the selection
# and scroll position instead; leave with q / Escape / Enter.
if-shell 'command -v win32yank.exe' {
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear 'win32yank.exe -i --crlf'
} {
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
}
